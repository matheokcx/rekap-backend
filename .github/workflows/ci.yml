name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le typage
        run: npm run typecheck

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Passer le linter
        run: npm run lint

  #  test:
  #    runs-on: ubuntu-24.04
  #    timeout-minutes: 15
  #    steps:
  #      - uses: actions/checkout@v4
  #
  #      - name: Installer les dépendances
  #        run: npm ci
  #
  #      - name: Passer les tests (unitaires, fonctionnels, ...)
  #        run: npm run test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    #    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer le build
        run: npm run build
