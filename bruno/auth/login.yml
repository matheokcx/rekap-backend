info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: '{{base-url}}/auth/login'
  body:
    type: json
    data: |
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setEnvVar("token", body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
