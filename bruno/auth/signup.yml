info:
  name: signup
  type: http
  seq: 2

http:
  method: POST
  url: '{{base-url}}/auth/signup'
  body:
    type: json
    data: |
      {
        "fullName": "Deleplanque Mathéo",
        "email": "{{email}}",
        "password": "{{password}}",
        "passwordConfirmation": "{{password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        bru.setEnvVar("token", body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
