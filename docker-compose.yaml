services:
  adonis-api:
    build:
      context: .
      target: development
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - .env
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - APP_URL=http://localhost:3333
    ports:
      - '3333:3333'
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - base

  postgres-db:
    image: postgres:17
    restart: always
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - base

  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - base

volumes:
  db:

networks:
  base:
